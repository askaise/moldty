<script>
(function(){
  try{
    function drawIcon(size, maskable){
      var c=document.createElement('canvas'); c.width=c.height=size; var g=c.getContext('2d');
      g.fillStyle='#0D1B4C';
      if(maskable){ g.fillRect(0,0,size,size); }
      else { var r=size*0.22; g.beginPath(); g.moveTo(r,0); g.arcTo(size,0,size,size,r); g.arcTo(size,size,0,size,r); g.arcTo(0,size,0,0,r); g.arcTo(0,0,size,0,r); g.closePath(); g.fill(); }
      var k=size/100, o=maskable?0:0; g.fillStyle='#FFC107'; g.beginPath();
      g.moveTo(56*k,14*k); g.lineTo(30*k,54*k); g.lineTo(47*k,54*k); g.lineTo(42*k,86*k); g.lineTo(70*k,44*k); g.lineTo(52*k,44*k); g.closePath(); g.fill();
      return c.toDataURL('image/png');
    }
    var i192=drawIcon(192,false), i512=drawIcon(512,false), m512=drawIcon(512,true);
    window.__APP_ICON_192=i192;
    var base=location.href.split('#')[0].split('?')[0];
    var scope=base.replace(/[^\/]*$/,'');
    var manifest={
      name:'إدارة مولدي', short_name:'مولدي', lang:'ar', dir:'rtl',
      id:base, start_url:base, scope:scope, display:'standalone',
      background_color:'#0D1B4C', theme_color:'#0D1B4C',
      icons:[
        {src:i192,sizes:'192x192',type:'image/png',purpose:'any'},
        {src:i512,sizes:'512x512',type:'image/png',purpose:'any'},
        {src:m512,sizes:'512x512',type:'image/png',purpose:'maskable'}
      ]
    };
    var l=document.createElement('link'); l.rel='manifest';
    l.href='data:application/manifest+json;charset=utf-8,'+encodeURIComponent(JSON.stringify(manifest));
    document.head.appendChild(l);
    var a=document.createElement('link'); a.rel='apple-touch-icon'; a.href=i192; document.head.appendChild(a);
    var f=document.createElement('link'); f.rel='icon'; f.type='image/png'; f.href=i192; document.head.appendChild(f);
    var m1=document.createElement('meta'); m1.name='apple-mobile-web-app-capable'; m1.content='yes'; document.head.appendChild(m1);
    var m2=document.createElement('meta'); m2.name='mobile-web-app-capable'; m2.content='yes'; document.head.appendChild(m2);
    var m3=document.createElement('meta'); m3.name='apple-mobile-web-app-title'; m3.content='مولدي'; document.head.appendChild(m3);
  }catch(e){ console.warn('PWA setup failed', e); }

  // زر التثبيت (يظهر فقط عندما يسمح المتصفح بالتثبيت)
  var deferred=null;
  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault(); deferred=e;
    if(localStorage.getItem('pwa-install-dismissed')==='1') return;
    var show=function(){
      if(document.getElementById('pwa-install-bar')) return;
      var d=document.createElement('div'); d.id='pwa-install-bar';
      d.style.cssText='position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:99999;background:#0D1B4C;color:#fff;border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 6px 24px rgba(0,0,0,.35);font-family:inherit';
      d.innerHTML='<div style="flex:1;font-size:14px;font-weight:600">ثبّت التطبيق على جهازك</div><button id="pwa-yes" style="background:#FFC107;color:#0D1B4C;border:0;border-radius:10px;padding:8px 16px;font-weight:700;cursor:pointer;font-family:inherit">تثبيت</button><button id="pwa-no" style="background:transparent;color:#fff;border:0;font-size:20px;cursor:pointer">×</button>';
      document.body.appendChild(d);
      d.querySelector('#pwa-yes').onclick=async function(){ d.remove(); try{ deferred.prompt(); await deferred.userChoice; }catch(_){} deferred=null; };
      d.querySelector('#pwa-no').onclick=function(){ d.remove(); try{localStorage.setItem('pwa-install-dismissed','1');}catch(_){} };
    };
    if(document.body) show(); else document.addEventListener('DOMContentLoaded', show);
  });
  window.addEventListener('appinstalled', function(){ var b=document.getElementById('pwa-install-bar'); if(b) b.remove(); });
})();
</script>

const AppSubStatus = Object.freeze({ trial:'trial', active:'active', expired:'expired' });
class SubscriptionInfo {

  get effectiveStatus(){
    if (this.status === AppSubStatus.expired) return AppSubStatus.expired;
    const now = TrustedClock.now();
    if (this.status === AppSubStatus.trial && !(this.trialEnd > now)) return AppSubStatus.expired;
    if (this.status === AppSubStatus.active && this.subscriptionEnd && !(this.subscriptionEnd > now)) return AppSubStatus.expired;

  async save(info){ const uid = sb.auth.currentUser?.id; if (!uid) return; await Prefs.setString(_statusKey(uid), JSON.stringify({ status:info.status, trialEnd:info.trialEnd.toISOString(), subscriptionEnd:info.subscriptionEnd?.toISOString() ?? null })); },

const WARNING_DAYS = WARNING_BEFORE_DAYS;
async function _legacyHasSmallAmounts(){
  try {
    const prices = await AmpPriceRepo.getAll();
    if (Object.values(prices).some(v=>v>0 && v<MIN_MONEY_AMOUNT)) return true;
    for (const s of await SubscriberRepo.getAll()){
      if (s.previousDebt>0 && s.previousDebt<MIN_MONEY_AMOUNT) return true;
      for (const e of s.history) if (e.amount!=null && e.amount>0 && e.amount<MIN_MONEY_AMOUNT) return true;
    }
  } catch {}
  return false;
}
async function renderSubscriptionGate(container, { onHome, onPaywall }){
  const user = sb.auth.currentUser; if (!user) return;
  let info = await SubStatusCache.read();
  if (!info){ const firstSeen = await SubStatusCache.firstSeen(); info = new SubscriptionInfo({ status:AppSubStatus.trial, trialEnd:new Date(firstSeen.getTime() + TRIAL_DAYS*86400000) }); }
  const route = (i)=>{
    const st = i.effectiveStatus;
    if (st===AppSubStatus.trial) NotificationService.scheduleTrialEndingReminders(i.trialEnd).catch(()=>{}); else NotificationService.cancelTrialEndingReminders().catch(()=>{});
    if (st===AppSubStatus.expired) NotificationService.startLockedDailyReminder().catch(()=>{}); else NotificationService.stopLockedDailyReminder().catch(()=>{});
    if (st===AppSubStatus.expired) onPaywall(i); else onHome(i);
  };
  (async ()=>{
    try {
      const { data, error } = await sb.from('app_subscriptions').select('*').eq('user_id', user.id).maybeSingle();
      if (error || !data) return;
      if (sb.auth.currentUser?.id !== user.id) return;
      let resolved;
      const trialEnd = new Date(data.trial_end);
      const subEnd = data.subscription_end ? new Date(data.subscription_end) : null;
      if (data.status==='active') resolved = (subEnd && subEnd < TrustedClock.now()) ? AppSubStatus.expired : AppSubStatus.active;
      else if (data.status==='trial') resolved = trialEnd < TrustedClock.now() ? AppSubStatus.expired : AppSubStatus.trial;
      else resolved = AppSubStatus.expired;
      const fresh = new SubscriptionInfo({ status:resolved, trialEnd, subscriptionEnd:subEnd });
      await SubStatusCache.save(fresh);
      if (fresh.effectiveStatus !== info.effectiveStatus || fresh.subscriptionEnd?.getTime() !== info.subscriptionEnd?.getTime()) route(fresh); else info = fresh;
    } catch {}
  })();
  LegacyMoneyRule.decideIfNeeded(_legacyHasSmallAmounts).catch(()=>{});
  route(info);
}

function openWhatsApp(phone, { message } = {}){
  const trimmed = (phone ?? '').trim();
  if (!trimmed){ snackbar('لا يوجد رقم هاتف مسجَّل لهذا المشترك'); return; }
  let digits = trimmed.replace(/[^0-9+]/g,'');
  if (digits.startsWith('+')) digits = digits.substring(1);
  else if (digits.startsWith('00')) digits = digits.substring(2);
  else if (digits.startsWith('0')) digits = '964' + digits.substring(1);
  else if (!digits.startsWith('964')) digits = '964' + digits;
  const q = message ? `?text=${encodeURIComponent(message)}` : '';
  window.open(`https://wa.me/${digits}${q}`, '_blank', 'noopener');
}

      const alreadyPaid = s.partialPaidFor(month);
      const effPrice = s.priceSnapshots.get(key) ?? frozenPrice;
      const dueAmt = Math.max(0, s.payableAmpsFor(month)*effPrice - s.discountFor(month));
      const remainingBefore = dueAmt - alreadyPaid;
      if (amount > remainingBefore + 0.01) throw new Error(`المبلغ أكبر من المتبقي (${formatMoney(Math.max(0, remainingBefore))} د.ع).`);

      const newTotal = alreadyPaid + amount;
      name = s.name; isFull = dueAmt<=0 || newTotal >= dueAmt - 0.01;

      else s.partialPayments.set(key, newTotal);

      s.history.unshift(new SubscriberEvent({ id:eventId, type: isFull ? SubscriberEventType.paymentFull : SubscriberEventType.paymentPartial, description: isFull ? `تسديد كامل لشهر ${key} — ${formatMoney(amount)} د.ع` : `تسديد جزئي لشهر ${key} — ${formatMoney(amount)} د.ع (الإجمالي المدفوع: ${formatMoney(newTotal)} من ${formatMoney(dueAmt)} د.ع)`, date:new Date(), month:key, amount }));

  const now = new Date(); const rows=[];
  let m = new Date(s.createdAt.getFullYear(), s.createdAt.getMonth(), 1);
  const end = s.billingMonthFor(now); let guard=0;
  while (m<=end && guard<600){
    const livePrice = await AmpPriceRepo.getFor(m, s.lineType);
    const price = s.resolvedPriceFor(m, livePrice);
    const amps = s.ampsFor(m); const discount = s.discountFor(m);
    const payableAmps = s.payableAmpsFor(m); const due = payableAmps*price - discount; const key = Subscriber.monthKey(m);
    const fullyPaid = s.paidMonths.has(key);
    const paid = fullyPaid ? Math.max(0, due) : s.partialPaidFor(m);
    const remainingRaw = fullyPaid ? 0 : (due - paid);
    rows.push(new MonthDebtRow({ month:m, price, amps, payableAmps, discount, due: due<0?0:due, paid, remaining: remainingRaw<0?0:remainingRaw, fullyPaid }));
    m = new Date(m.getFullYear(), m.getMonth()+1, 1); guard++;
  }
  return rows.reverse();
}
function buildSubscriberFinancialReport(s, rows){
  const lines=[]; lines.push(`السجل المالي للمشترك: ${s.name}`); lines.push(`نوع الخط: ${AmpLineTypeX.label(s.lineType)}`); lines.push('---------------------------');
  const totalDebt = rows.reduce((sum,r)=>sum+r.remaining, 0);
  for (const r of [...rows].reverse()) lines.push(r.sentence(s.name));
  lines.push('---------------------------');
  if (s.previousDebt>0){ lines.push(`دين سابق${s.previousDebtNote ? ` (${s.previousDebtNote})` : ''}: ${formatMoney(s.previousDebt)} د.ع — المسدَّد منه ${formatMoney(s.previousDebtPaid)} د.ع، المتبقي ${formatMoney(s.previousDebtRemaining)} د.ع.`); lines.push('---------------------------'); }
  lines.push(`إجمالي الديون المتراكمة: ${formatMoney(totalDebt + s.previousDebtRemaining)} د.ع`);
  return lines.join('\n');
}
function subscriberIdentifiersLine(s){ const parts=[]; if (s.boardNumber!=null) parts.push(`بورد ${s.boardNumber}`); if (s.fuseNumber!=null) parts.push(`جوزة ${s.fuseNumber}`); return parts.join('  •  '); }
function knownBoardNumbers(all){ const set = new Set(); for (const s of all) if (s.boardNumber?.trim()) set.add(s.boardNumber.trim()); return [...set].sort(); }
function boardGroupOf(all){ const map = new Map(); for (const s of all){ if (!map.has(s.boardNumber)) map.set(s.boardNumber, []); map.get(s.boardNumber).push(s); } return map; }

class Worker {

function _wKey(){ const uid = sb.auth.currentUser?.id ?? 'anon'; return `local_workers_v1_${uid}`; }
function _wSyncPayload(w, userId){ return { id:w.id, user_id:userId, name:w.name, salary:w.salary, created_at:w.createdAt.toISOString(), payments:w.payments.map(p=>p.toJson()) }; }
async function _wById(id){ const list = await WorkerRepo.getAll(); return list.find(w=>w.id===id) ?? null; }

  _fromRow(r){ return new Worker({ id:r.id, name:r.name ?? '', salary: typeof r.salary==='number' ? r.salary : 0, createdAt: r.created_at ? new Date(r.created_at) : new Date(), payments: (r.payments ?? []).map(WorkerPayment.fromJson) }); },
  _sameContent(a,b){ return a.name===b.name && a.salary===b.salary && JSON.stringify(a.payments.map(p=>p.toJson()))===JSON.stringify(b.payments.map(p=>p.toJson())); },
  async applyRemoteRows(rows, { deletedIds=new Set() } = {}){
    if (!rows.length && !deletedIds.size) return false;
    let changed=false;

      const protectedIds = await OfflineSync.pendingIdsFor('workers');
      const local = await this.getAll();

        const at = index.get(id);

        else if (!this._sameContent(local[at], remote)){ remote.createdAt = local[at].createdAt; local[at] = remote; changed=true; }
      }
      if (deletedIds.size){ const before = local.length; const filtered = local.filter(w=>!deletedIds.has(w.id) || protectedIds.has(w.id)); if (filtered.length!==before){ changed=true; local.length=0; local.push(...filtered); } }
      if (changed) await this._saveAll(local);
    });
    return changed;
  },
  async pullFromSupabase({ repushLocalOnly=false } = {}){
    const user = sb.auth.currentUser; if (!user) return false;

    const changed = await this.applyRemoteRows(rows, { deletedIds:deleted });
    if (repushLocalOnly){ const protectedIds = await OfflineSync.pendingIdsFor('workers'); const orphans = (await this.getAll()).filter(w=>!remoteIds.has(w.id) && !deleted.has(w.id) && !protectedIds.has(w.id)); if (orphans.length) await OfflineSync.enqueueMany('workers', 'upsert', orphans.map(w=>_wSyncPayload(w, user.id))); }
    return changed;
  },
  async importFromSupabase(){
    const user = sb.auth.currentUser; if (!user) return;
    try {
      const { data, error } = await sb.from('workers').select('*').eq('user_id', user.id);
      if (error) return;
      const remote = (data ?? []).map(r=>new Worker({ id:r.id, name:r.name ?? '', salary: typeof r.salary==='number' ? r.salary : 0, createdAt: r.created_at ? new Date(r.created_at) : new Date(), payments: (r.payments ?? []).map(WorkerPayment.fromJson) }));
      await KeyedLock.run(_wKey(), async ()=>{
        const local = await this.getAll(); const byId = new Map(local.map(w=>[w.id,w]));
        for (const w of remote){ const mine = byId.get(w.id); if (!mine) local.push(w); else { const have = new Set(mine.payments.map(p=>p.id)); for (const p of w.payments) if (!have.has(p.id)) mine.payments.push(p); mine.payments.sort((a,b)=>b.date-a.date); } }
        await this._saveAll(local);
      });
    } catch {}
  },
  async totalPaidForMonth(month){ const list = await this.getAll(); return list.reduce((sum,w)=>sum+w.totalPaid({ month }), 0); },
};

class HomeSummary {
  constructor({ totalSubscribers=0, totalAmps=0, paidCount=0, unpaidCount=0, expectedAmount=0, collectedAmount=0, fuelTotal=0, oilTotal=0, repairsTotal=0, salariesTotal=0, netAmount=0, previousDebtCollected=0, previousDebtOutstanding=0 }){
    this.totalSubscribers=totalSubscribers; this.totalAmps=totalAmps; this.paidCount=paidCount; this.unpaidCount=unpaidCount; this.expectedAmount=expectedAmount; this.collectedAmount=collectedAmount; this.fuelTotal=fuelTotal; this.oilTotal=oilTotal; this.repairsTotal=repairsTotal; this.salariesTotal=salariesTotal; this.netAmount=netAmount; this.previousDebtCollected=previousDebtCollected; this.previousDebtOutstanding=previousDebtOutstanding;
  }
  static empty(){ return new HomeSummary({}); }
  get expensesTotal(){ return this.fuelTotal+this.oilTotal+this.repairsTotal+this.salariesTotal; }
  get collectionRatio(){ if (this.expectedAmount<=0) return 0; return Math.min(1, Math.max(0, this.collectedAmount/this.expectedAmount)); }
}
const ExpenseCategory = Object.freeze({ fuel:'fuel', oil:'oil', repairs:'repairs', salaries:'salaries' });
const ExpenseCategoryX = {
  label(c){ return c===ExpenseCategory.fuel?'كاز':c===ExpenseCategory.oil?'دهن':c===ExpenseCategory.repairs?'إصلاحات':'رواتب'; },
  icon(c){ return c===ExpenseCategory.fuel?'fa-droplet':c===ExpenseCategory.oil?'fa-oil-can':c===ExpenseCategory.repairs?'fa-screwdriver-wrench':'fa-users'; },
  color(c){ return c===ExpenseCategory.fuel?'#2196F3':c===ExpenseCategory.oil?'#9C27B0':c===ExpenseCategory.repairs?'#FF9800':'#607D8B'; },
};
const HomeSummaryRepo = {
  async fetch(month, localSubscribers, ampPrice, { goldenAmpPrice=null, board=null } = {}){
    const golden = goldenAmpPrice ?? ampPrice;
    const priceFor = (s) => s.lineType===AmpLineType.golden ? golden : ampPrice;
    const boardKey = (!board || !board.trim()) ? null : normalizeBoardKey(board);
    const scope = boardKey==null ? localSubscribers : localSubscribers.filter(s=>normalizeBoardKey(s.boardNumber)===boardKey);
    const existed = scope.filter(s=>s.existedIn(month));
    const relevant = existed.filter(s=>!s.frozen && !s.isFullyFree);
    const paid = relevant.filter(s=>s.isPaidFor(month)).length;
    const totalAmps = relevant.reduce((sum,s)=>sum+s.payableAmpsFor(month), 0);
    const dueFor = (s) => { const raw = s.payableAmpsFor(month)*s.resolvedPriceFor(month, priceFor(s)) - s.discountFor(month); return Math.max(0, raw); };
    const expected = relevant.reduce((sum,s)=>sum+dueFor(s), 0);
    const collected = existed.filter(s=>!s.isFullyFree).reduce((sum,s)=>{ const due = dueFor(s); return sum + (s.isPaidFor(month)?due:s.partialPaidFor(month)); }, 0);
    const expenses = boardKey!=null ? [] : await ExpenseRepo._readLocal(month);
    const totalFor = (c) => expenses.filter(e=>e.category===c).reduce((sum,e)=>sum+(e.amount ?? 0), 0);
    const fuelTotal = totalFor(ExpenseCategory.fuel);
    const oilTotal = totalFor(ExpenseCategory.oil);
    const repairsTotal = totalFor(ExpenseCategory.repairs);
    const legacySalaries = totalFor(ExpenseCategory.salaries);
    const workersSalaries = boardKey!=null ? 0 : (await WorkerRepo.totalPaidForMonth(month).catch(()=>0));
    const salariesTotal = legacySalaries + workersSalaries;
    let prevCollected=0, prevOutstanding=0;
    for (const s of scope){
      prevOutstanding += s.previousDebtRemaining;
      for (const e of s.history){ if (e.isPreviousDebt && e.isActiveCash && e.date.getFullYear()===month.getFullYear() && e.date.getMonth()===month.getMonth()) prevCollected += (e.amount ?? 0); }
    }
    return new HomeSummary({ totalSubscribers:relevant.length, totalAmps, paidCount:paid, unpaidCount:relevant.length-paid, expectedAmount:expected, collectedAmount:collected, fuelTotal, oilTotal, repairsTotal, salariesTotal, netAmount: collected+prevCollected-fuelTotal-oilTotal-repairsTotal-salariesTotal, previousDebtCollected:prevCollected, previousDebtOutstanding:prevOutstanding });
  },
};
function _expenseCacheKey(month){ const uid = sb.auth.currentUser?.id ?? 'anon'; return `local_expenses_v1_${uid}_${month.getFullYear()}_${month.getMonth()+1}`; }
function _expensePrefix(){ const uid = sb.auth.currentUser?.id ?? 'anon'; return `local_expenses_v1_${uid}_`; }
function _expensePayloadFor(e, monthStr, userId){ return { id:e.id, user_id:userId, category:e.category, amount: typeof e.amount==='number' ? e.amount : 0, quantity: typeof e.quantity==='number' ? e.quantity : null, note:e.note ?? null, expense_month:monthStr }; }
function _sameExpense(a, b){ const n = v => typeof v==='number' ? v : null; return a.category===b.category && n(a.amount)===n(b.amount) && n(a.quantity)===n(b.quantity) && (a.note ?? '')===(b.note ?? ''); }
const ExpenseRepo = {
  async _readLocal(month){ const list = await LocalJson.read(_expenseCacheKey(month)); if (!Array.isArray(list)) return []; return list; },
  async add(category, amount, month, { quantity=null, note=null } = {}){

  async syncLocalToSupabase(){ const user = sb.auth.currentUser; if (!user) return; const items=[]; for (const month of await this._localMonths()){ const monthStr = toMonthStr(month); for (const e of await this._readLocal(month)) items.push(_expensePayloadFor(e, monthStr, user.id)); } await OfflineSync.enqueueMany('expenses', 'upsert', items); },
  async applyRemoteRows(rows){

    const byMonth = new Map();
    for (const r of rows){ const id = r.id?.toString(); if (!id || protectedIds.has(id)) continue; const d = r.expense_month ? parseMonthStr(r.expense_month) : null; if (!d) continue; const key = `${d.getFullYear()}_${d.getMonth()+1}`; if (!byMonth.has(key)) byMonth.set(key, []); byMonth.get(key).push({ id, category:r.category, amount: typeof r.amount==='number' ? r.amount : 0, quantity: typeof r.quantity==='number' ? r.quantity : null, note:r.note ?? null, time: (r.created_at ?? r.expense_month).toString() }); }

    return changed;

      for (const r of (data ?? [])){ const rawMonth = r.expense_month?.toString(); if (!rawMonth) continue; const d = parseMonthStr(rawMonth); if (!d) continue; const month = new Date(d.getFullYear(), d.getMonth(), 1); const key = `${month.getFullYear()}_${month.getMonth()+1}`; if (!byMonth.has(key)) byMonth.set(key, []); byMonth.get(key).push({ id:r.id, category:r.category, amount: typeof r.amount==='number' ? r.amount : 0, ...(r.quantity!=null ? { quantity:r.quantity } : {}), ...(r.note!=null ? { note:r.note } : {}), time: r.created_at ?? month.toISOString() }); }

        await KeyedLock.run(_expenseCacheKey(month), async ()=>{ const local = await this._readLocal(month); const existingIds = new Set(local.map(e=>e.id)); for (const remote of remoteList) if (!existingIds.has(remote.id)) local.push(remote); await LocalJson.write(_expenseCacheKey(month), local); });
      }

async function renderPaymentsScreen(container){
  let all=[], loading=true, error=null, query='';
  const priceCache = new Map();
  const priceCacheKey = (month, type) => `${month.getFullYear()}-${String(month.getMonth()+1).padStart(2,'0')}-${type}`;
  const root = document.createElement('div'); root.className='screen';
  const load = async ()=>{
    try {
      error = null; all = await SubscriberRepo.getAll();
      const needed = new Map();
      for (const s of all){ const bm = s.billingMonthFor(new Date()); needed.set(priceCacheKey(bm, s.lineType), { month:bm, type:s.lineType }); }
      const newCache = new Map();
      for (const [k,v] of needed) newCache.set(k, await AmpPriceRepo.getFor(v.month, v.type));
      priceCache.clear(); for (const [k,v] of newCache) priceCache.set(k, v);
    } catch (e){ error = `تعذر تحميل بيانات الدفع: ${e.message ?? e}`; }
    loading = false; render();
  };
  const priceFor = (s, month) => priceCache.get(priceCacheKey(month, s.lineType)) ?? 0;
  const filtered = ()=>{ if (!query.trim()) return all; const q = query.trim().toLowerCase(); return all.filter(s=>s.name.toLowerCase().includes(q) || s.phone.includes(q) || (s.fuseNumber?.toLowerCase().includes(q) ?? false) || (s.boardNumber?.toLowerCase().includes(q) ?? false)); };
  const openPaymentDialog = async (s)=>{
    const now = new Date();
    const hasExtraDebt = s.hasPreviousDebt || s.unpaidClosedMonths(now).length>0;
    if (hasExtraDebt){ await showUnifiedPaymentDialog(s, { onChanged:load }); return; }
    const billMonth = s.billingMonthFor(now);
    const price = await AmpPriceRepo.getFor(billMonth, s.lineType);
    await showRecordPaymentDialog(s, { price, month:billMonth, onChanged:load });
  };
  const render = ()=>{
    if (loading){ root.innerHTML = '<div class="screen-body" style="text-align:center;padding:40px"><i class="fa-solid fa-spinner fa-spin" style="font-size:32px;color:var(--navy)"></i></div>'; return; }
    if (error){ root.innerHTML = `<div class="screen-body" style="text-align:center;padding:40px 24px"><div style="color:var(--red);margin-bottom:12px">${_esc(error)}</div><button class="btn btn-primary" id="retry">إعادة المحاولة</button></div>`; root.querySelector('#retry').onclick = load; return; }
    const list = filtered(); const now = new Date();
    root.innerHTML = `
      <div class="screen-body">
        <h2 style="font-size:22px;margin:0 0 4px">تسديد دفعة مشترك</h2>
        <p style="font-size:13px;color:#616161;margin:0 0 14px">اضغط على بطاقة المشترك لفتح نافذة الدفع مباشرة</p>
        <div class="search-bar"><i class="fa-solid fa-search" style="color:#757575"></i><input id="search" placeholder="ابحث بالاسم أو الهاتف أو رقم الجوزة..." value="${_esc(query)}"></div>
        ${list.length===0 ? `<div style="text-align:center;padding:60px 20px"><i class="fa-solid fa-magnifying-glass" style="font-size:56px;color:#BDBDBD"></i><div style="font-size:17px;font-weight:700;margin-top:12px">${query.trim() ? 'لا يوجد مشترك مطابق' : 'لا يوجد مشتركون بعد'}</div><div style="font-size:13px;color:#616161;margin-top:6px">${query.trim() ? 'جرّب كتابة جزء آخر من الاسم أو الرقم' : 'أضف مشتركين من تبويب المشتركين ثم عُد هنا للتسديد'}</div></div>` : list.map(s=>{
          const billMonth = s.billingMonthFor(now);
          const price = priceFor(s, billMonth);
          const paidThisMonth = s.isPaidFor(billMonth);
          const remaining = s.remainingFor(billMonth, price);
          const due = Math.max(0, s.payableAmpsFor(billMonth) * s.resolvedPriceFor(billMonth, price) - s.discountFor(billMonth));
          return `<div class="sub-card ${paidThisMonth?'paid':'unpaid'}" data-id="${s.id}" style="cursor:pointer"><div style="display:flex;gap:10px;align-items:flex-start"><div class="sub-avatar ${paidThisMonth?'paid':'unpaid'}"><i class="fa-solid ${paidThisMonth?'fa-check':'fa-hourglass-half'}"></i></div><div style="flex:1;min-width:0"><div style="display:flex;align-items:center;gap:4px"><b style="font-size:16.5px;flex:1">${_esc(s.name)}</b>${s.lineType===AmpLineType.golden ? '<i class="fa-solid fa-star" style="color:#FFC107;font-size:16px"></i>' : ''}</div><div style="font-size:13px;color:#616161;margin-top:3px">${s.amps.toFixed(0)} أمبير  •  ${_esc(s.phone)}</div>${(s.fuseNumber!=null || s.boardNumber!=null) ? `<div style="font-size:12.5px;color:#9E9E9E;margin-top:2px">${_esc(subscriberIdentifiersLine(s))}</div>` : ''}${s.hasPreviousDebt ? `<div style="background:#FFF3E0;color:var(--orange);border-radius:8px;padding:6px 8px;font-size:12.5px;margin-top:6px;display:inline-block" data-prev-debt><i class="fa-solid fa-history"></i> دين سابق متبقي ${s.previousDebtRemaining.toFixed(0)} د.ع — اضغط للتسديد</div>` : ''}${s.unpaidClosedMonths(now).length>0 ? `<div style="background:var(--red-50);color:var(--red);border-radius:8px;padding:6px 8px;font-size:12.5px;margin-top:6px;display:inline-block" data-unpaid-closed><i class="fa-solid fa-triangle-exclamation"></i> متأخرات ${s.unpaidClosedMonths(now).length} شهر سابق — اضغط للتسديد</div>` : ''}${s.isFullyFree ? '<div style="color:var(--purple);font-weight:700;font-size:14px;margin-top:6px">مجاني</div>' : paidThisMonth ? `<div style="color:var(--green);font-weight:700;font-size:14px;margin-top:6px">مسدَّد هذا الشهر ✓</div>` : `<div style="color:var(--orange);font-weight:700;font-size:15px;margin-top:6px">${remaining<due-0.01 ? `مدفوع جزئياً — متبقي ${remaining.toFixed(0)} د.ع` : `المستحق ${remaining.toFixed(0)} د.ع`}</div>`}</div><div style="display:flex;flex-direction:column;gap:4px"><button class="btn btn-icon" data-details title="تفاصيل المشترك"><i class="fa-solid fa-info-circle" style="color:#616161;font-size:22px"></i></button><button class="btn btn-icon" data-wa title="فتح واتساب" style="background:#E8F5E9"><i class="fa-brands fa-whatsapp" style="color:var(--green);font-size:22px"></i></button></div></div></div>`;
        }).join('')}
      </div>`;
    root.querySelector('#search').oninput = e=>{ query = e.target.value; rerenderKeepingSearch(root, e.target, render); };
    root.querySelectorAll('.sub-card').forEach(card=>{
      const id = card.getAttribute('data-id'); const s = all.find(x=>x.id===id); if (!s) return;
      card.onclick = (e)=>{ if (e.target.closest('button[data-details]') || e.target.closest('button[data-wa]')) return; openPaymentDialog(s); };
      const detailsBtn = card.querySelector('[data-details]');
      if (detailsBtn) detailsBtn.onclick = e=>{ e.stopPropagation(); showSubscriberDetailsSheet(s, { onChanged:load }); };
      const waBtn = card.querySelector('[data-wa]');
      if (waBtn) waBtn.onclick = e=>{ e.stopPropagation(); openWhatsApp(s.phone); };
    });
  };
  container.innerHTML=''; container.appendChild(root);
  bindLive(root, f=>RealtimeSync.changes.addEventListener(f), f=>RealtimeSync.changes.removeEventListener(f), ()=>load());
  render();
  await load(); return root;
}

async function showRecordPaymentDialog(s, { price, onChanged, month=null } = {}){
  const target = month ?? new Date();
  const key = Subscriber.monthKey(target);
  const effectivePrice = s.resolvedPriceFor(target, price);
  const monthPaid = s.isPaidFor(target); const priceMissing = effectivePrice<=0; const blocked = monthPaid || priceMissing;
  const blockMessage = monthPaid ? 'هذا الشهر مسدَّد بالكامل — لا يمكن تسجيل دفعة أو خصم عليه. لتصحيح خطأ ألغِ التسديد أو الدفعة من تفاصيل المشترك.' : priceMissing ? (DevicePermissions.has(Perm.editPrices) ? 'لم يُحدَّد سعر الأمبير لهذا الشهر بعد. حدِّده من الشاشة الرئيسية (✏️) ثم أعد فتح نافذة الدفع.' : 'لم يُحدَّد سعر الأمبير لهذا الشهر بعد. اطلب من صاحب الحساب تحديده ثم أعد فتح نافذة الدفع.') : null;
  let priceInherited = false;
  if (!blocked) priceInherited = !s.priceSnapshots.has(key) && !(await AmpPriceRepo.isExplicitlySet(target, s.lineType));
  let due = s.payableAmpsFor(target) * effectivePrice - s.discountFor(target); if (due<0) due=0;
  let remaining = s.remainingFor(target, price);
  const alreadyPaid = s.partialPaidFor(target); const baseRemaining = remaining;
  let amountEditedManually = false;
  const html = `<h3>تسديد دفعة — ${_esc(s.name)}</h3><div style="font-size:13px;color:#616161;margin-bottom:8px">${s.amps.toFixed(0)} أمبير  •  ${AmpLineTypeX.label(s.lineType)}</div>${(s.fuseNumber!=null || s.boardNumber!=null) ? `<div style="font-size:12px;color:#616161;margin-bottom:8px">${_esc(subscriberIdentifiersLine(s))}</div>` : ''}<div style="margin-bottom:4px">المستحق بعد أي خصم: <b id="due-text">${formatMoney(due)}</b> د.ع</div>${alreadyPaid>0 ? `<div style="color:var(--green);font-size:12.5px;margin-bottom:2px">مدفوع مسبقاً (أقساط سابقة) هذا الشهر: ${formatMoney(alreadyPaid)} د.ع</div>` : ''}<div style="margin-bottom:10px">المتبقي الواجب تسديده: <b id="remaining-text" style="color:${remaining>0?'var(--red)':'var(--green)'}">${formatMoney(remaining)}</b> د.ع</div>${s.hasPreviousDebt ? `<div id="prev-debt-note" style="background:#FFF3E0;border:1px solid #FFE0B2;border-radius:8px;padding:8px;font-size:12px;color:var(--orange);cursor:pointer;margin-bottom:10px"><i class="fa-solid fa-history"></i> ملاحظة: يوجد دين سابق على هذا المشترك — متبقي ${formatMoney(s.previousDebtRemaining)} د.ع${s.previousDebtNote ? ` (${_esc(s.previousDebtNote)})` : ''}. اضغط هنا لتسديده.</div>` : ''}${blockMessage ? `<div style="background:var(--red-50);border:1px solid var(--red-100);border-radius:8px;padding:8px;color:var(--red);font-size:12px;margin-bottom:10px">${_esc(blockMessage)}</div>` : ''}${priceInherited ? `<div style="background:var(--orange-50);border:1px solid var(--orange-100);border-radius:8px;padding:8px;color:var(--orange);font-size:12px;margin-bottom:10px">تنبيه: لم يُحدَّد سعر هذا الشهر صراحةً بعد — سيُستخدم سعر آخر شهر مُسعَّر ${DevicePermissions.has(Perm.viewPrices) ? `(${formatMoney(effectivePrice)} د.ع/أمبير) ` : ''}ويُجمَّد لهذا المشترك عند حفظ الدفعة.</div>` : ''}${DevicePermissions.has(Perm.applyDiscount) ? `<label class="field"><span>خصم (اختياري)</span><div class="input-wrap"><i class="fa-solid fa-percent prefix"></i><input id="discount-input" type="text" inputmode="numeric" ${blocked?'disabled':''}><span class="suffix">د.ع</span></div><div class="hint">يُخصَم من مستحق هذا الشهر قبل احتساب المتبقي</div></label>` : ''}<label class="field"><span>المبلغ المراد تسديده الآن</span><div class="input-wrap"><input id="amount-input" type="text" inputmode="numeric" ${blocked?'disabled':''}><span class="suffix">د.ع</span></div><div class="hint">أدخل جزءاً من المبلغ لتسجيله كقسط، والباقي يبقى ديناً معلَّقاً</div></label><label class="field"><span>ملاحظات (اختياري)</span><div class="input-wrap"><textarea id="notes-input" rows="2" style="resize:none"></textarea></div></label><div class="actions"><button class="btn btn-tonal" data-close>إلغاء</button><button class="btn btn-primary" id="save-btn" ${blocked?'disabled':''}>حفظ الدفع</button></div>`;
  const { el, close, promise } = openDialog(html);
  const amountEl = el.querySelector('#amount-input'), discountEl = el.querySelector('#discount-input'), notesEl = el.querySelector('#notes-input'), saveBtn = el.querySelector('#save-btn'), dueText = el.querySelector('#due-text'), remText = el.querySelector('#remaining-text'), prevNote = el.querySelector('#prev-debt-note');
  if (amountEl){ amountEl.value = remaining>0 ? formatMoney(remaining) : '0'; attachMoneyFormatter(amountEl); amountEl.addEventListener('input', ()=>{ if (amountEl.value !== formatMoney(remaining) && amountEl.value !== '0') amountEditedManually = true; }); }
  if (discountEl) attachMoneyFormatter(discountEl);
  const recompute = ()=>{
    const extraDiscount = discountEl ? (parseAmount(discountEl.value) ?? 0) : 0;
    const newDue = Math.max(0, s.payableAmpsFor(target)*effectivePrice - s.discountFor(target) - extraDiscount);
    const newRemaining = Math.max(0, newDue - alreadyPaid);
    due = newDue; remaining = newRemaining;
    if (dueText) dueText.textContent = formatMoney(due);
    if (remText){ remText.textContent = formatMoney(remaining); remText.style.color = remaining>0 ? 'var(--red)' : 'var(--green)'; }
    if (!amountEditedManually && amountEl) amountEl.value = newRemaining>0 ? formatMoney(newRemaining) : '0';
  };
  if (discountEl) discountEl.addEventListener('input', recompute);
  if (prevNote) prevNote.onclick = async ()=>{ const ok = await showPayPreviousDebtDialog(s); if (!ok) return; const all = await SubscriberRepo.getAll(); const idx = all.findIndex(x=>x.id===s.id); if (idx!==-1) s.copyStateFrom(all[idx]); recompute(); onChanged?.(); };
  saveBtn.onclick = async ()=>{
    const discErr = moneyError(discountEl?.value ?? '', { optional:true, allowZero:true, settles:baseRemaining });
    const payErr = moneyError(amountEl.value, { optional:true, allowZero:true, settles:remaining });
    if (discErr || payErr){ await showMoneyErrorDialog(discErr ? `الخصم: ${discErr}` : `الدفعة: ${payErr}`); return; }
    const discountValue = parseAmount(discountEl?.value) ?? 0;
    const amountValue = parseAmount(amountEl.value) ?? 0;
    if (discountValue > baseRemaining + 0.01){ snackbar(`الخصم أكبر من المتبقي على الشهر (${formatMoney(baseRemaining)} د.ع)`); return; }
    if (discountValue<=0 && amountValue<=0){ snackbar('أدخل خصماً أو مبلغ تسديد أكبر من صفر'); return; }
    if (amountValue > remaining + 0.01){ snackbar(`المبلغ أكبر من المتبقي (${formatMoney(remaining)} د.ع)`); return; }
    saveBtn.disabled = true; saveBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
    let discountSaved = false;
    try {
      if (discountValue>0){ await SubscriberRepo.applyDiscount(s.id, { month:target, amount:discountValue, price:effectivePrice, notes:notesEl.value.trim() || null }); discountSaved = true; }
      if (amountValue>0){ await SubscriberRepo.recordPayment(s.id, { month:target, amount:amountValue, dueAmount:due, price:effectivePrice, notes:notesEl.value.trim() || null }); }
      else if (discountValue>0 && remaining<=0.01){ await SubscriberRepo.setPaid(s.id, true, { month:target, price:effectivePrice }); }
      close(true);
      const isFull = amountValue >= remaining - 0.01 && remaining>0;
      snackbar(amountValue<=0 ? `تم تسجيل الخصم لـ ${s.name}` : isFull ? `تم تسديد دفعة ${s.name} بالكامل` : `تم تسجيل قسط بقيمة ${formatMoney(amountValue)} د.ع لـ ${s.name}`, DevicePermissions.has(Perm.issueReceipts) ? { actionLabel:'إصدار الوصل', onAction: async ()=>{ const fresh = await SubscriberRepo.getAll(); const updated = fresh.find(x=>x.id===s.id) ?? s; const rows = await buildSubscriberDebtHistory(updated); const rowKey = Subscriber.monthKey(target); const row = rows.find(r=>Subscriber.monthKey(r.month)===rowKey); if (!row) return; await printOrSharePaymentReceipt(updated, row); } } : {});
      onChanged?.();
      if (amountValue>0){ _autoPrintMonthReceipt(s, target).catch(()=>{}); }
    } catch (e) {
      if (discountSaved){ close(true); snackbar(`تم تسجيل الخصم لكن تعذر تسجيل الدفعة: ${e.message ?? e} — أعد فتح نافذة الدفع.`); onChanged?.(); }
      else { snackbar(`تعذر حفظ الدفعة: ${e.message ?? e}`); saveBtn.disabled = false; saveBtn.textContent = 'حفظ الدفع'; }
    }
  };
  return promise;
}
async function showUnifiedPaymentDialog(s, { onChanged } = {}){
  const allRows = await buildSubscriberDebtHistory(s);
  const unpaidRows = [...allRows].reverse().filter(r=>r.remaining>0.01);
  const previousDebtRemaining = s.previousDebtRemaining;
  const totalDue = previousDebtRemaining + unpaidRows.reduce((sum,r)=>sum+r.remaining, 0);
  const missingPriceMonths = allRows.filter(r=>!r.fullyPaid && r.price<=0 && r.payableAmps>0).map(r=>r.monthLabel);
  if (totalDue<=0.01 && missingPriceMonths.length===0){ snackbar('لا يوجد مبلغ مستحق على هذا المشترك حالياً.'); return; }
  const blocked = missingPriceMonths.length>0;
  const blockMessage = blocked ? `لم يُحدَّد سعر الأمبير لشهر ${missingPriceMonths.join('، ')} بعد. ${DevicePermissions.has(Perm.editPrices) ? 'حدِّده من الشاشة الرئيسية (✏️)' : 'اطلب من صاحب الحساب تحديده'} ثم أعد فتح نافذة الدفع.` : null;

    } catch (e){ hadError = true; snackbar(`تعذر إكمال تسديد كل البنود: ${e.message ?? e}`); close(true); }
    saveBtn.disabled = false; saveBtn.textContent = 'حفظ الدفع';

    onChanged?.();
    if (!hadError){ _autoPrintUnifiedReceipts(s, paidPrevious, paidMonths, paidAmounts).catch(()=>{}); }
  };
  return promise;
}

const { jsPDF } = window.jspdf;
function _posMoney(v){ return `${formatMoney(v)} د.ع`; }
function _posDateAr(d){ return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`; }
function posSafeText(s){ if (!s) return ''; return String(s).replace(/[•▪◦]/g, ' ').replace(/\s+/g, ' ').trim(); }
function posPageFormat(){ const svc = PosPrinterService.instance; const widthMm = svc.paperSize===PosPaperSize.mm80 ? 72 : 48; const widthPt = widthMm * 2.83465; return { widthPt, heightPt:900, marginL:4, marginR:4, marginT:6, marginB:4 }; }
async function _posBody(doc, { pageWidth, margin, y, generatorName, title, rows, statusText, qrDataUrl }){
  const innerWidth = pageWidth - 2*margin;
  if (generatorName && generatorName.trim()){ drawArabicText(doc, generatorName, pageWidth/2, y, { fontSize:10, align:'center' }); y += 12; }
  drawArabicText(doc, title, pageWidth/2, y, { fontSize:9, align:'center' }); y += 10;
  doc.setDrawColor(120,120,120); doc.setLineWidth(0.3); doc.setLineDashPattern([1,1], 0);
  doc.line(margin, y, pageWidth-margin, y); doc.setLineDashPattern([], 0); y += 6;
  for (const [label, value] of rows){
    const safeLabel = posSafeText(label); const safeValue = posSafeText(String(value));
    doc.setFont('Amiri', 'normal'); doc.setFontSize(8);
    const labelWidth = doc.getTextWidth(shapeAndReorder(safeLabel));
    drawArabicText(doc, safeLabel, pageWidth-margin, y, { fontSize:8, align:'right' });
    const valueLines = wrapArabicText(doc, safeValue, innerWidth-labelWidth-8, { fontSize:8 });
    let vy = y;
    for (const line of valueLines){ drawArabicText(doc, line, pageWidth-margin-labelWidth-8, vy, { fontSize:8, align:'right' }); vy += 10; }
    y = Math.max(y+12, vy);
  }
  doc.setLineDashPattern([1,1], 0); doc.line(margin, y, pageWidth-margin, y); doc.setLineDashPattern([], 0); y += 6;
  drawArabicText(doc, statusText, pageWidth/2, y, { fontSize:9, align:'center' }); y += 10;
  drawArabicText(doc, `تاريخ الإصدار: ${_posDateAr(new Date())}`, pageWidth/2, y, { fontSize:7, align:'center', color:[120,120,120] }); y += 10;
  if (qrDataUrl){ const qrSize = 90; try{ doc.addImage(qrDataUrl, 'PNG', (pageWidth-qrSize)/2, y, qrSize, qrSize); y += qrSize+4; drawArabicText(doc, 'امسح الكود للتحقق من الوصل', pageWidth/2, y, { fontSize:7, align:'center', color:[120,120,120] }); y += 10; } catch {} }
  return y;
}

async function buildPosStatementPdf({ s, rows:debtRows, generatorName=null }){

async function buildPosCombinedReceiptPdf({ s, paidPrevious, monthParts, history, generatorName=null }){

  await ensureArabicFont(doc);
  const pageWidth = fmt.widthPt, margin = fmt.marginL;
  const SubKey = m => { const d = m instanceof Date ? m : new Date(m); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; };

  const monthsLeft = history.reduce((sum,r)=>sum+(r.remaining>0.01?r.remaining:0), 0);
  const prevLeftTotal = s.previousDebtRemaining>0 ? s.previousDebtRemaining : 0;
  const totalLeft = monthsLeft + prevLeftTotal;
  let qrDataUrl = null;
  try { const monthLabel = [...(paidPrevious>0.01?['دين سابق']:[]), ...monthParts.map(p=>{ const row = byKey.get(SubKey(p.month)); return row ? row.monthLabel : `${p.month.getFullYear()}/${String(p.month.getMonth()+1).padStart(2,'0')}`; })].join(' + '); const qrText = await ReceiptCodeService.encode(new ReceiptCodePayload({ kind:ReceiptCodeKind.monthPayment, issuer:settings.effectiveIssuerName(generatorName), subscriber:s.name, month:monthLabel, paid:totalNow, remaining:totalLeft, issuedAt:new Date() })); qrDataUrl = await buildReceiptQrDataUrl(qrText, 200); } catch {}
  const baseRows = [['المشترك', s.name]];
  if (settings.showPhoneOnReceipt && s.phone) baseRows.push(['الهاتف', s.phone]);
  if (settings.showIdentifiersOnReceipt){ const ids = subscriberIdentifiersLine(s); if (ids) baseRows.push(['المعرفات', ids]); }
  const allRows = [...baseRows, ...itemRows, ['إجمالي المستلَم الآن', _posMoney(totalNow)]];

  const finalY = await _posBody(doc, { pageWidth, margin, y:fmt.marginT+8, generatorName: settings.showGeneratorNameOnReceipt ? settings.effectiveIssuerName(generatorName) : '', title:'وصل استلام دفعة', rows:allRows, statusText, qrDataUrl });
  return doc.output('arraybuffer');

    const itemCount = (paidPrevious>0?1:0) + paidMonths.length;
    if (itemCount===1){
      if (paidPrevious>0){ await _posPrintAndReport(()=>printOrSharePreviousDebtReceipt(updated, paidPrevious)); return; }
      const key = Subscriber.monthKey(paidMonths[0]);
      const row = rows.find(r=>Subscriber.monthKey(r.month)===key);
      if (row) await _posPrintAndReport(()=>printOrSharePaymentReceipt(updated, row));
      return;
    }
    const parts = paidMonths.map((m,i)=>new PosPaidMonthPart(m, i<paidAmounts.length ? paidAmounts[i] : 0));
    await _posPrintAndReport(()=>printCombinedReceiptToPos({ s:updated, paidPrevious, monthParts:parts, history:rows }));
  } catch {}
}
async function _posPrintAndReport(job){
  toastFloat('جاري تجهيز الوصل...', { ok:true });
  let result;
  try { result = await job(); }
  catch (e){ result = { ok:false, message:`تعذّر إنشاء الوصل: ${e.message ?? e}`, status:PosPrintStatus.failed }; }
  if (!result) return;
  if (result.status===PosPrintStatus.cancelled) return;
  if (result.ok){ await _posShowShareDialog(); }
  else { await openDialogWait(`<h3>تعذّر تجهيز الوصل</h3><p>${String(result.message ?? '').replace(/[<>]/g, '')}</p><div class="actions"><button class="btn btn-primary" data-close>حسناً</button></div>`); }
}
async function _posShowShareDialog(){
  const svc = PosPrinterService.instance;
  const { el, close, promise } = openDialog(`<h3>الوصل جاهز</h3><div style="white-space:pre-wrap;background:#F5F5F5;padding:8px;border-radius:6px;font-size:12px;max-height:150px;overflow:auto">${(svc.pendingText ?? 'اضغط لمشاركة الوصل.').replace(/[<>]/g, '')}</div><div class="actions"><button class="btn btn-tonal" data-close>إغلاق</button><button class="btn btn-primary" id="share-btn"><i class="fa-solid fa-share"></i> مشاركة الوصل</button></div>`);
  el.querySelector('#share-btn').onclick = async ()=>{ const r = await svc.sharePending(); if (r.ok) close(); else if (r.status!==PosPrintStatus.cancelled) toastFloat(r.message, { ok:false }); };
  await promise;
}

function _rcptMoney(v){ return `${formatMoney(v)} د.ع`; }
function _rcptDateAr(d){ return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`; }
function _drawTextWithSlashes(doc, text, x, y, { fontSize=11, align='right' } = {}){
  if (!text.includes('/')) return drawArabicText(doc, text, x, y, { fontSize, align });
  const parts = text.split('/'); const totalWidth = fontSize*0.6;
  const partWidths = parts.map(p=>{ doc.setFont('Amiri','normal'); doc.setFontSize(fontSize); return doc.getTextWidth(shapeAndReorder(p)); });
  const total = partWidths.reduce((s,w)=>s+w,0) + (parts.length-1)*totalWidth;
  let cursorX = align==='right' ? x-total : (align==='center' ? x-total/2 : x);
  for (let i=0;i<parts.length;i++){ doc.setFont('Amiri','normal'); doc.setFontSize(fontSize); const shaped = shapeAndReorder(parts[i]); doc.text(shaped, cursorX, y); cursorX += partWidths[i]; if (i<parts.length-1){ const cx = cursorX + totalWidth/2; doc.setDrawColor(0,0,0); doc.setLineWidth(0.4); doc.line(cx-fontSize*0.15, y+1, cx+fontSize*0.15, y-fontSize*0.35); cursorX += totalWidth; } }
}
function _rcptHeader(doc, title, subtitle, pageWidth, margin){
  let y = margin+12;
  if (title && title.trim()){ drawArabicText(doc, title, pageWidth/2, y, { fontSize:16, align:'center' }); y += 18; }
  drawArabicText(doc, subtitle, pageWidth/2, y, { fontSize:12, align:'center', color:[100,100,100] }); y += 12;
  doc.setDrawColor(180,180,180); doc.setLineWidth(0.5); doc.line(margin, y, pageWidth-margin, y);
  return y+10;
}
function _rcptInfoTable(doc, pairs, pageWidth, margin, y, colSplit=0.4){
  const totalWidth = pageWidth-2*margin; const labelWidth = totalWidth*colSplit; const valueWidth = totalWidth-labelWidth;
  for (const [label, value] of pairs){
    const valueStr = typeof value==='string' ? value : String(value);
    const valueLines = wrapArabicText(doc, valueStr, valueWidth-6, { fontSize:10 });
    const rowHeight = Math.max(14, valueLines.length*12+2);
    doc.setFillColor(240,240,240); doc.rect(pageWidth-margin-labelWidth, y, labelWidth, rowHeight, 'F');
    doc.setDrawColor(200,200,200); doc.setLineWidth(0.3);
    doc.rect(pageWidth-margin-labelWidth, y, labelWidth, rowHeight);
    doc.rect(pageWidth-margin-labelWidth-valueWidth, y, valueWidth, rowHeight);
    drawArabicText(doc, label, pageWidth-margin-4, y+10, { fontSize:10, align:'right' });
    let vy = y+10;
    for (const line of valueLines){ drawArabicText(doc, line, pageWidth-margin-labelWidth-4, vy, { fontSize:10, align:'right' }); vy += 12; }
    y += rowHeight;
  }
  return y+6;
}

async function _rcptSharePdfBytes(bytes, fileName, { text=null } = {}){

function _downloadBlob(blob, name){ const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 1000); }

function renderQrScannerScreen(container, { onDone } = {}){
  let processing=false, error=null, stream=null, rafId=null, videoEl=null, canvasEl=null, ctx=null;
  const root = document.createElement('div'); root.className='screen'; root.style.background='#000'; root.style.color='#fff';
  const handleDetect = async (raw)=>{
    if (processing) return;
    processing = true; stopCamera();
    let restored = false;
    try {
      const payload = await SupabaseQrSessionPayload.fromQrData(raw);
      if (payload.isExpired) throw new QrSessionTransferException('انتهت صلاحية رمز QR. اطلب من الهاتف المسجّل الدخول إنشاء رمز جديد.');
      await DevicePermissions.applyForUser(payload.userId, payload.permissions);
      const { data, error: setErr } = await sb.auth.refreshSession({ refresh_token: payload.refreshToken });
      if (setErr) throw setErr;
      const { data: sessionData } = await sb.auth.getSession();
      const session = data?.session ?? sessionData?.session;
      if (!session) throw new QrSessionTransferException('فشل استعادة Session من رمز QR.');
      if (session.user.id !== payload.userId){ await sb.auth.signOut(); throw new QrSessionTransferException('رمز QR لا يطابق حساب Supabase المتوقع.'); }
      const current = (await sb.auth.getSession()).data?.session; if (current?.user) _authUser = current.user;
      if (!current || current.user.id !== payload.userId) throw new QrSessionTransferException('تمت استعادة الجلسة لكن لم تصبح فعالة على هذا الهاتف.');
      restored = true;
      if (payload.deviceName) await DeviceNameRepo.set(payload.deviceName);
      await new Promise(r=>setTimeout(r, 200));
      stopCamera(); onDone?.(true); return;
    } catch (e){
      if (e instanceof FormatException) showError('QR غير صالح. امسح رمز QR الخاص بتسجيل الدخول من داخل التطبيق فقط.');
      else if (e instanceof QrSessionTransferException) showError(e.message);
      else showError(_qrAuthErrorMessage(e));
    } finally {
      if (!restored) await DevicePermissions.clear();
      processing = false;
      if (error) await startCamera();
    }
  };
  const _qrAuthErrorMessage = (e)=>{
    const msg = String(e?.message ?? '').toLowerCase();
    if (!e?.status && (msg.includes('socket') || msg.includes('network') || msg.includes('timeout') || msg.includes('connection'))) return 'فشل الاتصال بالإنترنت. تحقق من الشبكة ثم جرّب مرة أخرى.';
    if (msg.includes('refresh') || msg.includes('token') || msg.includes('invalid') || msg.includes('expired')) return 'Session غير صالحة أو منتهية. اطلب رمز QR جديداً من الهاتف المسجّل الدخول.';
    return 'فشل استعادة Session. جرّب مرة أخرى.';
  };
  const showError = (msg)=>{ error = msg; paint(); };
  const startCamera = async ()=>{
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:{ ideal:'environment' } } });
      if (videoEl){ videoEl.srcObject = stream; await videoEl.play(); scanLoop(); }
    } catch (e){ showError('تعذر الوصول للكاميرا: ' + (e.message ?? e)); }
  };
  const stopCamera = ()=>{ if (rafId){ cancelAnimationFrame(rafId); rafId=null; } if (stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; } };
  const scanLoop = ()=>{
    if (!videoEl || !canvasEl || !ctx) return;
    if (videoEl.readyState !== videoEl.HAVE_ENOUGH_DATA){ rafId = requestAnimationFrame(scanLoop); return; }
    const w = videoEl.videoWidth, h = videoEl.videoHeight;
    if (w===0 || h===0){ rafId = requestAnimationFrame(scanLoop); return; }
    canvasEl.width = w; canvasEl.height = h;
    ctx.drawImage(videoEl, 0, 0, w, h);
    const imageData = ctx.getImageData(0, 0, w, h);
    if (window.jsQR){ const code = window.jsQR(imageData.data, w, h, { inversionAttempts:'dontInvert' }); if (code && code.data){ handleDetect(code.data); return; } }
    rafId = requestAnimationFrame(scanLoop);

function renderQrCodeEntryScreen(container, { onDone } = {}){

      const session = data?.session ?? sessionData?.session;

    const codeEl = root.querySelector('#code-in');

function renderAppSubscriptionScreen(container, { info, blocking=false, onBack=null }){

  const buildCaption = (fullName)=>{ const lines = ['وصل دفع اشتراك تطبيق إدارة مولدي']; if (fullName && fullName.trim()) lines.push(`اسم المشترك: ${fullName.trim()}`); lines.push(`اسم الحساب: ${accountName}`); lines.push(`عدد الأشهر: ${selectedMonths}`); lines.push(`المبلغ الإجمالي: ${totalAmount()} د.ع`); lines.push(`رقم حساب السوبر كي المستلم: ${accountNumber}`); return lines.join('\n'); };
  const lookupFullName = async (userId)=>{ const user = sb.auth.currentUser; try{ const { data } = await sb.from('profiles').select('full_name').eq('id', userId).maybeSingle(); return data?.full_name ?? user?.user_metadata?.full_name ?? ''; } catch { return user?.user_metadata?.full_name ?? ''; } };
  const openWhatsAppChat = async ({ fullName=null } = {})=>{ let name = fullName ?? ''; if (!name){ const user = sb.auth.currentUser; if (user) name = await lookupFullName(user.id); } const text = encodeURIComponent(buildCaption(name)); window.open(`https://wa.me/${developerWhatsApp}?text=${text}`, '_blank', 'noopener'); };
  const submitAndShare = async ()=>{
    if (!receiptFile){ snackbar('يرجى اختيار صورة وصل الدفع أولاً'); return; }
    const user = sb.auth.currentUser; if (!user){ snackbar('يجب تسجيل الدخول أولاً'); return; }
    const caption = buildCaption(cachedName);
    uploading = true; paint();
    // المشاركة أولاً لأن المتصفحات تشترط أن تكون ضمن نقرة المستخدم
    let handled = false;
    try { if (navigator.canShare && navigator.canShare({ files:[receiptFile] })){ await navigator.share({ files:[receiptFile], text:caption }); handled = true; } }
    catch (e){ if (e?.name==='AbortError') handled = true; }
    if (!handled) window.open(`https://wa.me/${developerWhatsApp}?text=${encodeURIComponent(caption)}`, '_blank', 'noopener');
    try {
      const ext = (receiptFile.name.split('.').pop() ?? 'jpg').toLowerCase();
      const validExt = /^[a-z0-9]{2,5}$/.test(ext) ? ext : 'jpg';
      const { error } = await sb.storage.from('receipts').upload(`${user.id}/${Date.now()}.${validExt}`, receiptFile);
      if (error) throw error;
    } catch { snackbar('تعذّر رفع نسخة الوصل للخادم — أرسل الصورة للمطوّر عبر واتساب'); }
    uploading = false; paint();
  };

    try {
      const { data } = await sb.from('app_config').select('key, value');
      const map = {}; for (const r of (data ?? [])) map[r.key] = r.value;
      accountNumber = map.super_key_account_number ?? accountNumber;
      accountName = map.super_key_account_name ?? accountName;
      developerWhatsApp = map.developer_whatsapp_number ?? developerWhatsApp;
      pricePerMonth = parseInt(map.price_per_month_iqd ?? '', 10) || pricePerMonth;
    } catch {}
    try{ const u = sb.auth.currentUser; if (u) cachedName = await lookupFullName(u.id); }catch{}
    loadingConfig = false; paint();
  };
  const paint = ()=>{
    if (loadingConfig){ root.innerHTML = `${blocking ? '' : '<div class="app-bar"><div class="title">تفعيل اشتراك التطبيق</div></div>'}<div style="text-align:center;padding:60px"><i class="fa-solid fa-spinner fa-spin" style="font-size:32px"></i></div>`; return; }
    root.innerHTML = `${blocking ? '' : `<div class="app-bar"><button class="icon-btn" id="back"><i class="fa-solid fa-arrow-right"></i></button><div class="title">تفعيل اشتراك التطبيق</div></div>`}<div class="screen-body">${blocking ? `<div style="text-align:center;margin-bottom:24px"><i class="fa-solid fa-lock" style="color:var(--red);font-size:72px"></i><h2 style="color:var(--red);margin:12px 0 6px">انتهت فترتك التجريبية</h2><p style="color:#616161;font-size:15px;line-height:1.5;margin:0">فعّل اشتراكك للاستمرار باستخدام التطبيق وحفظ بيانات مشتركيك</p></div>` : ''}<div class="card flat" style="background:#FAFAFA;border:1px solid var(--divider)"><div style="display:flex;align-items:center;gap:8px;margin-bottom:12px"><i class="fa-solid fa-wallet" style="font-size:22px"></i><b style="font-size:18px">معلومات الدفع</b></div><div style="display:flex;justify-content:space-between;padding:3px 0"><span style="color:#616161">السعر الشهري</span><b>${pricePerMonth} د.ع</b></div><div style="display:flex;justify-content:space-between;padding:3px 0"><span style="color:#616161">اسم الحساب (سوبر كي)</span><b>${_esc(accountName)}</b></div><div style="display:flex;justify-content:space-between;padding:3px 0"><span style="color:#616161">رقم الحساب</span><b>${_esc(accountNumber)}</b></div><p style="font-size:14px;color:#616161;line-height:1.4;margin:8px 0 0">قم بتحويل المبلغ إلى الحساب أعلاه، ثم صوّر وصل الدفع وارفعه على الواتساب.</p></div><div style="margin-top:20px"><b style="font-size:16px">عدد الأشهر</b><div class="segmented" id="months-seg" style="margin-top:8px"><button data-v="1" class="${selectedMonths===1?'active':''}">شهر واحد</button><button data-v="6" class="${selectedMonths===6?'active':''}">6 أشهر</button><button data-v="12" class="${selectedMonths===12?'active':''}">سنة كاملة</button></div></div><div style="background:var(--green-50);border-radius:14px;padding:14px;text-align:center;margin-top:14px"><div style="font-size:13.5px;color:#616161">المبلغ الإجمالي</div><div style="font-weight:800;font-size:28px;color:var(--green);margin-top:2px" id="total">${totalAmount()} د.ع</div></div>${receiptFile ? `<div style="margin-top:20px;text-align:center"><img id="receipt-preview" style="max-height:220px;border-radius:12px;max-width:100%"></div>` : ''}<div style="display:flex;gap:10px;margin-top:10px"><button class="btn btn-outline btn-block" id="pick-gallery" style="flex:1;min-height:50px"><i class="fa-solid fa-images"></i> من المعرض</button><button class="btn btn-outline btn-block" id="pick-camera" style="flex:1;min-height:50px"><i class="fa-solid fa-camera"></i> تصوير الوصل</button></div><input type="file" id="file-picker" accept="image/*" style="display:none"><button class="btn btn-primary btn-block" id="submit-btn" style="margin-top:16px;min-height:54px;font-size:16px" ${uploading?'disabled':''}>${uploading ? '<i class="fa-solid fa-spinner fa-spin"></i> جاري الإرسال...' : '<i class="fa-solid fa-paper-plane"></i> إرسال الوصل وتفعيل الطلب'}</button><button class="btn btn-block" id="wa-btn" style="color:var(--green);margin-top:8px"><i class="fa-brands fa-whatsapp"></i> فتح محادثة واتساب مع المطوّر</button>${blocking ? '<button class="btn btn-outline-red btn-block" id="signout-btn" style="margin-top:8px"><i class="fa-solid fa-right-from-bracket"></i> تسجيل الخروج</button>' : ''}</div>`;
    const backBtn = root.querySelector('#back');
    if (backBtn) backBtn.onclick = ()=>{ if (onBack) onBack(); else window.location.reload(); };
    root.querySelectorAll('#months-seg button').forEach(b=>{ b.onclick = ()=>{ selectedMonths = parseInt(b.getAttribute('data-v'),10); paint(); }; });
    const pickGallery = root.querySelector('#pick-gallery'), pickCamera = root.querySelector('#pick-camera'), filePicker = root.querySelector('#file-picker');
    pickGallery.onclick = ()=>{ filePicker.removeAttribute('capture'); filePicker.click(); };
    pickCamera.onclick = ()=>{ filePicker.setAttribute('capture', 'environment'); filePicker.click(); };

    const img = root.querySelector('#receipt-preview');

class SubscribersImportResult { constructor(added, skipped){ this.added=added; this.skipped=skipped; } }
function pickSubscribersExcelBytes(){
  return new Promise((resolve)=>{
    const input = document.createElement('input'); input.type='file'; input.accept='.xlsx,.xls'; input.addEventListener('cancel', ()=>resolve(null));
    input.onchange = async ()=>{ const file = input.files?.[0]; if (!file){ resolve(null); return; } try{ const buffer = await file.arrayBuffer(); resolve(new Uint8Array(buffer)); } catch { resolve(null); } };
    input.click();
  });
}
async function importSubscribersFromExcelBytes(bytes){
  if (!window.XLSX) throw new Error('مكتبة XLSX غير محمَّلة — تحقّق من index.html');
  let workbook;
  try { workbook = window.XLSX.read(bytes, { type:'array' }); } catch (e){ throw new Error('الملف ليس ملف إكسل صالحاً (.xlsx)'); }
  const sheetName = workbook.SheetNames?.[0];
  if (!sheetName) throw new Error('الملف لا يحتوي أي ورقة بيانات');
  const sheet = workbook.Sheets[sheetName];
  const rows = window.XLSX.utils.sheet_to_json(sheet, { header:1, blankrows:false, defval:'', raw:false });
  if (rows.length <= 1) return new SubscribersImportResult(0, ['الملف فارغ — لا توجد صفوف بيانات']);
  let added=0; const skipped=[];
  const existing = await SubscriberRepo.getAll();
  const dupKey = (n,p) => `${(n ?? '').trim().toLowerCase()}|${normalizeBoardKey(p)}`;
  const seen = new Set(existing.map(s=>dupKey(s.name, s.phone)));
  for (let r=1;r<rows.length;r++){
    const row = rows[r] ?? []; const rowNum = r+1;
    const cell = (i)=>{ if (i>=row.length) return ''; const v = row[i]; if (v==null) return ''; return String(v).trim(); };
    const isBlank = [0,1,2,3,4,5,6,7,8].every(i=>cell(i)==='');
    if (isBlank) continue;
    const name = cell(0); if (!name){ skipped.push(`الصف ${rowNum}: الاسم فارغ`); continue; }
    const amps = parseAmount(cell(1)); if (amps==null || amps<=0){ skipped.push(`الصف ${rowNum} (${name}): عدد الأمبيرات غير صحيح`); continue; }
    let phone = cell(2); if (!phone){ skipped.push(`الصف ${rowNum} (${name}): رقم الهاتف فارغ`); continue; }
    phone = _fixPossiblyStrippedLeadingZero(phone);
    if (seen.has(dupKey(name, phone))){ skipped.push(`الصف ${rowNum} (${name}): مشترك مكرر (نفس الاسم والهاتف)`); continue; }
    seen.add(dupKey(name, phone));
    const location = cell(3), fuseNumber = cell(4), boardNumber = cell(5), lineTypeRaw = cell(6);
    const prevDebt = parseAmount(cell(7)) ?? 0; const prevDebtNote = cell(8);
    const lineType = lineTypeRaw.includes('ذهب') ? AmpLineType.golden : AmpLineType.normal;
    const subscriber = new Subscriber({ id:newLocalId(), name, amps, phone, location: location || null, fuseNumber:Subscriber.normalizeOptional(fuseNumber), boardNumber:Subscriber.normalizeOptional(boardNumber), lineType, previousDebt: prevDebt>0 ? prevDebt : 0, previousDebtNote: prevDebt>0 ? Subscriber.normalizeOptional(prevDebtNote) : null });
    try { await SubscriberRepo.add(subscriber); added++; } catch (e){ skipped.push(`الصف ${rowNum} (${name}): تعذّر الحفظ — ${e.message ?? e}`); }
  }
  return new SubscribersImportResult(added, skipped);
}
function _fixPossiblyStrippedLeadingZero(phone){ const s = String(phone ?? '').trim(); if (/^\d+$/.test(s) && s.length===10 && s.startsWith('7')) return '0'+s; return s; }

// ============================================================================
// 37) auth (login screen)
// ============================================================================
function renderLoginScreen(container){
  const root = document.createElement('div'); root.className='login-screen';
  root.innerHTML = `<i class="fa-solid fa-bolt logo"></i><h1>إدارة مولدي</h1><p class="tagline">إدارة مشتركي المولدة والتسديدات بسهولة</p><div class="error" style="display:none"></div><button class="login-btn google" data-x="google"><i class="fa-brands fa-google" style="font-size:22px"></i><span>تسجيل الدخول بحساب كوكل</span></button><button class="login-btn qr" data-x="qr"><i class="fa-solid fa-qrcode"></i><span>تسجيل الدخول عبر QR</span></button><button class="login-btn code" data-x="code"><i class="fa-solid fa-key"></i><span>إدخال كود تفعيل</span></button><p class="trial-note">فترة تجربة مجانية لمدة 30 يوم عند أول استخدام</p>`;
  container.innerHTML=''; container.appendChild(root);
  const errEl = root.querySelector('.error');
  const showErr = m=>{ errEl.textContent = m; errEl.style.display = 'block'; };
  const hideErr = ()=>{ errEl.style.display = 'none'; };
  const setLoading = on=>{ root.querySelectorAll('button').forEach(b=>b.disabled = on); const gb = root.querySelector('[data-x=google] span'); gb.textContent = on ? 'جاري تسجيل الدخول...' : 'تسجيل الدخول بحساب كوكل'; };
  root.querySelector('[data-x=google]').onclick = async ()=>{
    setLoading(true); hideErr();
    try { const { error } = await sb.auth.signInWithOAuth({ provider:'google', options:{ redirectTo:WEB_REDIRECT_URL } }); if (error) throw error; }
    catch (e){ showErr(`فشل تسجيل الدخول: ${e.message ?? e}`); }
    finally { setLoading(false); }
  };
  root.querySelector('[data-x=qr]').onclick = ()=>{ renderQrScannerScreen(container, { onDone:(ok)=>{ if (ok){ routeAfterLogin(); return; } renderLoginScreen(container); } }); };
  root.querySelector('[data-x=code]').onclick = ()=>{ renderQrCodeEntryScreen(container, { onDone:(ok)=>{ if (ok){ routeAfterLogin(); return; } renderLoginScreen(container); } }); };
}

// ============================================================================
// 38) main (bootstrap)
// ============================================================================
const appRoot = document.getElementById('app-root');
let _routedUid = null;
function _enterApp(){
  renderSubscriptionGate(appRoot, { onHome: (info)=>renderHomeShell(appRoot, info), onPaywall: (info)=>renderAppSubscriptionScreen(appRoot, { info, blocking:true }) });
}
function routeAfterLogin(){
  const uid = sb.auth.currentUser?.id ?? null;
  if (uid === _routedUid && uid !== null) return;
  _routedUid = uid;
  if (!uid){ renderLoginScreen(appRoot); return; }
  _shellTabIndex = 0;
  _enterApp();
}
async function bootstrap(){
  try { const { data } = await sb.auth.getSession(); _authUser = data?.session?.user ?? null; } catch {}
  try {
    await DevicePermissions.init();
    await LegacyMoneyRule.init();
    await TrustedClock.init();
    await OfflineModeSettings.init();
    await DisplaySettings.init();
    NotificationService.init().catch(()=>{});
    NotificationService.startPeriodicChecks();
    NotificationService.scheduleOpenAppReminders().catch(()=>{});
    OfflineSync.start();
    RealtimeSync.instance.start();
  } catch (e){ console.error('bootstrap error', e); }
  // طلب إذن الإشعارات يحتاج نقرة من المستخدم
  document.addEventListener('click', ()=>{ if (typeof Notification!=='undefined' && Notification.permission==='default'){ try{ Notification.requestPermission(); }catch{} } }, { once:true });
  hideSplash();
}
function hideSplash(){ const s = document.getElementById('boot-splash'); if (s){ s.classList.add('hidden'); setTimeout(()=>s.remove(), 300); } }
function renderApp(){
  sb.auth.onAuthStateChange((event, sess)=>{
    if (event === 'SIGNED_OUT'){ _routedUid = null; renderLoginScreen(appRoot); return; }
    const uid = sess?.user?.id;
    if (uid && uid !== _routedUid) setTimeout(routeAfterLogin, 0);
  });
  routeAfterLogin();
}
bootstrap().then(()=>{ renderApp(); setTimeout(hideSplash, 100); });
</script>
